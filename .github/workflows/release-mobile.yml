name: Release Modex Mobile

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ios_testflight:
        description: Archive Modex with Xcode and upload to TestFlight
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: modex-mobile-release
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ios_testflight) }}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CI: '1'
      TELEGRAM_CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Apple signing secrets
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_JSON_BASE64: ${{ secrets.ASC_API_KEY_JSON_BASE64 }}
        run: |
          test -n "$IOS_SIGNING_CERTIFICATE_BASE64"
          test -n "$IOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$ASC_API_KEY_JSON_BASE64"
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: pod install --project-directory=ios
      - name: Install Apple signing credentials
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/distribution.mobileprovision"
          keychain="$RUNNER_TEMP/modex-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode -o "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$app_id" = '6668YNMX76.com.prototypebyai.modex'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Modex.xcworkspace \
            -scheme Modex \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Modex.xcarchive" \
            DEVELOPMENT_TEAM=6668YNMX76 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>6668YNMX76</string>
            <key>provisioningProfiles</key><dict>
              <key>com.prototypebyai.modex</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Modex.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_JSON_BASE64: ${{ secrets.ASC_API_KEY_JSON_BASE64 }}
        run: |
          printf '%s' "$ASC_API_KEY_JSON_BASE64" | base64 --decode -o "$RUNNER_TEMP/asc-api-key.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "asc-api-key.json").read_text())
          key_id = data["key_id"]
          issuer_id = data["issuer_id"]
          key_path = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{key_id}.p8"
          key_path.parent.mkdir(parents=True, exist_ok=True)
          key_path.write_text(data["key"])
          key_path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ASC_KEY_ID={key_id}\nASC_ISSUER_ID={issuer_id}\n")
          PY
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Modex.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Notify Telegram after successful upload
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Modex build ${GITHUB_RUN_NUMBER} uploaded to TestFlight. Apple processing may continue. ${run_url}"

  android:
    if: ${{ vars.MOBILE_ANDROID_RELEASE_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Android release token
        run: test -n "$EXPO_TOKEN"
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx eas-cli@latest build --platform android --profile production --non-interactive --wait
      - run: npx eas-cli@latest submit --platform android --profile production --latest --non-interactive --wait
